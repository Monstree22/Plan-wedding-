<title>Rencana Nikah</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: satu kolom sempit seperti aplikasi HP; tab di atas, ringkasan dulu, detail kemudian. Data dipakai bersama lewat db. */
:root {
  --bg: #f3f5ef;
  --surface: #ffffff;
  --fg: #1c241d;
  --muted: #65705f;
  --line: #dde3d6;
  --accent: #4f6b52;
  --accent-fg: #ffffff;
  --accent-soft: #e3ebdd;
  --good: #2b7a6b;
  --warn: #b25e09;
  --bad: #b3261e;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121713; --surface: #1b221c; --fg: #e8eee6; --muted: #9aa896; --line: #2c352d;
    --accent: #a9c7a1; --accent-fg: #14210f; --accent-soft: #27332a;
    --good: #6fd6bd; --warn: #f0a24f; --bad: #ff8a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121713; --surface: #1b221c; --fg: #e8eee6; --muted: #9aa896; --line: #2c352d;
  --accent: #a9c7a1; --accent-fg: #14210f; --accent-soft: #27332a;
  --good: #6fd6bd; --warn: #f0a24f; --bad: #ff8a80; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-block: 20px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 640px; margin: 0 auto; display: grid; gap: 16px; }
h1, h2 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-size: 26px; letter-spacing: -0.01em; }
h2 { font-size: 18px; }
.sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.tabs button { flex: 1 0 auto; border: 0; background: none; color: var(--muted); font: 600 14px var(--font-body); padding: 9px 14px; border-radius: 9px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.stack { display: grid; gap: 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.row > * { min-width: 0; }
label { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; text-transform: uppercase; flex: 1 1 140px; }
input, select, textarea { font: 400 15px var(--font-body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 64px; }
input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.btn { border: 0; background: var(--accent); color: var(--accent-fg); font: 600 14px var(--font-body); padding: 10px 16px; border-radius: 8px; cursor: pointer; }
.btn.ghost { background: var(--accent-soft); color: var(--accent); }
.btn[disabled] { opacity: .5; cursor: default; }
.x { border: 0; background: none; color: var(--muted); font: 600 18px var(--font-body); cursor: pointer; padding: 4px 8px; border-radius: 6px; }
.x:hover, .x.armed { color: var(--bad); }
.x.armed { font-size: 12px; }
.count { display: flex; gap: 12px; flex-wrap: wrap; }
.count div { flex: 1 1 120px; background: var(--accent-soft); border-radius: 10px; padding: 12px; }
.count b { display: block; font: 700 28px var(--font-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.count span { font-size: 12px; color: var(--muted); }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.task { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.task:first-of-type { border-top: 0; }
.task .body { flex: 1; min-width: 0; }
.task.done .t { text-decoration: line-through; color: var(--muted); }
.meta { font-size: 12px; color: var(--muted); }
.meta.late { color: var(--bad); font-weight: 600; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.pill.good { color: var(--good); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 700px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 6px 4px; }
td { padding: 4px; border-top: 1px solid var(--line); }
td input { padding: 7px 8px; }
.num { text-align: right; }
.over { color: var(--bad); font-weight: 600; }
.empty { color: var(--muted); text-align: center; padding: 16px 0; display: grid; gap: 10px; justify-items: center; }
.notice { font-size: 13px; background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 8px 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { border: 1px solid var(--line); background: var(--surface); color: var(--muted); font: 600 13px var(--font-body); padding: 6px 12px; border-radius: 99px; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.refs { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.ref { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: grid; align-content: start; min-width: 0; }
.ref img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: var(--line); }
.ref .in { padding: 12px; display: grid; gap: 6px; min-width: 0; }
.ref .top { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
.ref h3 { margin: 0; font: 700 16px var(--font-display); overflow-wrap: anywhere; }
.ref a { color: var(--accent); font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
.ref p { margin: 0; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.ref select { width: auto; padding: 5px 8px; font-size: 13px; }
.price { font-variant-numeric: tabular-nums; font-weight: 600; }
details summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.hero { background: var(--accent); color: var(--accent-fg); border-radius: 18px; padding: 22px 20px 16px; display: grid; gap: 14px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -48px; top: -48px; width: 170px; height: 170px; border-radius: 50%; border: 26px solid color-mix(in srgb, var(--accent-fg) 14%, transparent); pointer-events: none; }
.hero .big { font: 700 80px/0.9 var(--font-display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.hero .cap { font-size: 14px; opacity: .92; }
.hero .chips { display: flex; gap: 6px; flex-wrap: wrap; }
.hero .chips span { background: color-mix(in srgb, var(--accent-fg) 18%, transparent); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; }
.track { position: relative; height: 60px; margin: 4px 8px 0; }
.track .line { position: absolute; left: 0; right: 0; top: 28px; height: 4px; border-radius: 9px; background: color-mix(in srgb, var(--accent-fg) 28%, transparent); }
.track .line i { display: block; height: 100%; background: var(--accent-fg); border-radius: 9px; }
.stop { position: absolute; top: 0; height: 60px; width: 0; }
.stop::before { content: ""; position: absolute; left: -8px; top: 22px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent-fg); border: 3px solid var(--accent); box-sizing: border-box; }
.stop span { position: absolute; top: 42px; left: 0; transform: translateX(-50%); font-size: 12px; font-weight: 600; white-space: nowrap; }
.stop.up span { top: 0; }
.stop.l span { transform: none; }
.stop.r span { transform: translateX(-100%); }
.like { border: 1px solid var(--line); background: var(--surface); color: var(--muted); font: 600 13px var(--font-body); padding: 5px 12px; border-radius: 99px; cursor: pointer; }
.like[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.like[disabled] { opacity: .5; cursor: default; }
.task.g { flex-wrap: wrap; }
.task.g .body { flex: 1 1 100%; }
.split { display: grid; gap: 8px; }
.split div { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.split .bar { height: 6px; }
.pay { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pay .plabel { font-weight: 600; font-size: 13px; min-width: 70px; }
.pay input[type="number"] { flex: 1 1 110px; width: auto; }
.pay input[type="date"] { flex: 1 1 140px; width: auto; }
.time { font: 700 16px var(--font-display); font-variant-numeric: tabular-nums; min-width: 52px; color: var(--accent); }
.entry p { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.entry.done p { text-decoration: line-through; color: var(--muted); }
.exports { display: flex; gap: 8px; flex-wrap: wrap; }
a.btn { text-decoration: none; display: inline-block; }
.linkbox { font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-wrap: anywhere; }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .3s; } }
</style>

<main>
  <header>
    <h1>Rencana Nikah</h1>
    <p class="sub" id="countdown"></p>
  </header>
  <div class="notice" id="notice" hidden></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <section id="view"></section>
</main>

<script>
const TABS = [["ringkasan","Ringkasan"],["checklist","Checklist"],["budget","Budget"],["vendor","Vendor"],["tamu","Tamu"],["undangan","Undangan"],["referensi","Referensi"],["seserahan","Seserahan"],["harih","Hari-H"],["jurnal","Jurnal"]];
const INVITE_URL = "https://claude.ai/artifact/K1zvvkPmP2PkMC6J1rAudw";
const SES_STATUS = { belum: "Belum dibeli", dibeli: "Sudah dibeli", dihias: "Sudah dihias" };
const RUN_DAYS = ["Lamaran", "Hari-H"];
const J_KINDS = { keputusan: ["Keputusan", "good"], catatan: ["Catatan", ""], bahas: ["Perlu dibahas", "warn"] };
const TEMPLATE = [
  // [tugas, kategori, acuan (L = lamaran, W = nikah), berapa bulan sebelumnya]
  ["Obrolan berdua: visi, budget, 3 prioritas","Fondasi","W",12],
  ["Bicara dengan orang tua: restu, adat, kontribusi biaya","Fondasi","W",12],
  ["Buka tabungan khusus pernikahan","Fondasi","W",12],
  ["Tentukan konsep lamaran dan lokasi","Lamaran","L",2],
  ["Beli cincin","Lamaran","L",2],
  ["Siapkan seserahan (daftar, belanja, hias)","Lamaran","L",1.5],
  ["Pesan katering lamaran","Lamaran","L",1],
  ["Pesan fotografer lamaran","Lamaran","L",1],
  ["Pesan busana keluarga untuk lamaran","Lamaran","L",1],
  ["Kirim undangan lamaran","Lamaran","L",0.5],
  ["Briefing juru bicara dan urutan acara lamaran","Lamaran","L",0.25],
  ["Survei dan booking venue","Venue & vendor","W",11],
  ["Booking Wedding Organizer (jika dipakai)","Venue & vendor","W",10],
  ["Booking katering","Venue & vendor","W",10],
  ["Booking dokumentasi foto dan video","Venue & vendor","W",9],
  ["Booking MUA","Venue & vendor","W",9],
  ["Booking dekorasi","Venue & vendor","W",9],
  ["Pilih MC dan hiburan","Venue & vendor","W",7],
  ["Pesan busana pengantin dan keluarga","Busana","W",7],
  ["Fitting pertama","Busana","W",4],
  ["Fitting kedua","Busana","W",2],
  ["Tes menu katering","Venue & vendor","W",5],
  ["Foto pre-wedding (opsional)","Acara","W",5],
  ["Daftar tamu final","Tamu","W",4],
  ["Desain dan cetak undangan","Tamu","W",3],
  ["Sebar undangan","Tamu","W",2],
  ["Urus dokumen nikah (KUA/gereja/catatan sipil)","Dokumen","W",3],
  ["Kursus atau bimbingan pranikah","Dokumen","W",3],
  ["Pesan seserahan dan mahar","Acara","W",2],
  ["Konfirmasi ulang semua vendor secara tertulis","Venue & vendor","W",1],
  ["Rundown final dan gladi bersih","Acara","W",0.5],
  ["Konfirmasi RSVP dan denah duduk","Tamu","W",0.5],
  ["Packing koper (akad, resepsi, bulan madu)","Acara","W",0.25],
  ["Pelunasan vendor","Venue & vendor","W",0.1],
  ["Update KTP dan KK setelah nikah","Dokumen","W",-1],
  ["Kirim ucapan terima kasih ke tamu dan vendor","Acara","W",-1]
];
const BUDGET_TEMPLATE = ["Venue & katering","Dekorasi","MUA & busana","Foto & video","MC & hiburan","Undangan & souvenir","Seserahan & mahar","Admin & transport","Dana cadangan (10%)"];
const REF_CATS = ["Dekorasi","Busana","MUA","Wedding Organizer","Venue","Katering","Foto & video","Seserahan","Undangan","Lainnya"];
const REF_STATUS = { ide: ["Ide", ""], kandidat: ["Kandidat", "warn"], dipilih: ["Dipilih", "good"], ditolak: ["Ditolak", "bad"] };
const SIDES = { pria: "Keluarga pria", wanita: "Keluarga wanita", teman: "Teman", kolega: "Kolega" };
const PAYERS = { bersama: "Berdua", pria: "Pihak pria", wanita: "Pihak wanita", ortupria: "Ortu pria", ortuwanita: "Ortu wanita" };
const STAT = { belum: ["Belum dikirim", ""], terkirim: ["Terkirim", "warn"], hadir: ["Hadir", "good"], tidak: ["Tidak hadir", "bad"] };

const S = { meta: { lamaran: "", wedding: "", target: 0 }, tasks: [], budget: [], guests: [], refs: [], votes: [], vendors: [], seserahan: [], rundown: [], journal: [], loaded: {} };
let dlApi = null, db = null, userApi = null, assetsApi = null, canWrite = true, me = null, state = "loading";
let tab = (location.hash || "").slice(1);
if (!TABS.some(t => t[0] === tab)) tab = "ringkasan";
let refCat = "Semua", refStatus = "semua", pendingRender = false;
const names = {};

const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rp = n => "Rp " + new Intl.NumberFormat("id-ID").format(Math.round(n || 0));
const $ = id => document.getElementById(id);
const byOrd = (a, b) => (a.ord || 0) - (b.ord || 0);

function cleanUrl(u) {
  u = (u || "").trim(); if (!u) return "";
  if (!/^https?:\/\//i.test(u)) u = "https://" + u;
  try { return new URL(u).href; } catch (e) { return ""; }
}
function dueDate(t) {
  const base = t.ref === "L" ? S.meta.lamaran : S.meta.wedding;
  if (!base) return null;
  const d = new Date(base + "T00:00:00");
  const whole = Math.trunc(t.m), days = Math.round((t.m - whole) * 30);
  d.setMonth(d.getMonth() - whole); d.setDate(d.getDate() - days);
  return d;
}
const fmtDate = d => d.toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const daysTo = iso => iso ? Math.round((new Date(iso + "T00:00:00") - today()) / 864e5) : null;

/* ---------- penyimpanan bersama ---------- */
async function write(fn) {
  if (!db || !canWrite) return;
  try { await fn(); } catch (e) {
    if (e && e.code === "quota_exceeded") flash("Penyimpanan penuh. Hapus beberapa data lama.");
    else flash("Gagal menyimpan. Coba lagi.");
  }
}
const col = n => db.collection(n);
const setMeta = patch => write(() => db.doc("meta/settings").set({ ...S.meta, ...patch }));
let flashT;
function flash(msg) { const n = $("notice"); n.textContent = msg; n.hidden = false; clearTimeout(flashT); flashT = setTimeout(updateNotice, 4000); }
function updateNotice() {
  const n = $("notice");
  const msg = state === "nodb" ? "Masuk ke Claude untuk menyimpan dan berbagi data."
    : !canWrite ? "Kamu hanya bisa melihat. Minta akses Contributor atau Editor untuk ikut mengisi." : "";
  n.textContent = msg; n.hidden = !msg;
}

function subscribe(name, key) {
  col(name).onSnapshot(snap => {
    S[key] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    S.loaded[key] = true; schedule();
  }, () => { S.loaded[key] = true; schedule(); });
}
function subscribeMeta() {
  db.doc("meta/settings").onSnapshot(snap => {
    S.meta = { lamaran: "", wedding: "", target: 0, ...(snap.exists ? snap.data() : {}) };
    S.loaded.meta = true; schedule();
  }, () => { S.loaded.meta = true; schedule(); });
}
function schedule() {
  const a = document.activeElement;
  if (a && $("view").contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && a.type !== "checkbox") { pendingRender = true; return; }
  view();
}
document.addEventListener("focusout", () => { if (pendingRender) setTimeout(() => { if (pendingRender && !document.activeElement.matches("input,select,textarea")) { pendingRender = false; view(); } }, 50); });

async function init() {
  view();
  try { db = await claude.use("db"); } catch (e) { db = null; }
  if (!db) { state = "nodb"; updateNotice(); view(); return; }
  state = "ready";
  try { userApi = await claude.use("user"); } catch (e) {}
  try { assetsApi = await claude.use("assets"); } catch (e) {}
  try { dlApi = await claude.use("downloads"); } catch (e) {}
  if (userApi) {
    try { me = await userApi.id(); } catch (e) {}
    try { if ((await userApi.can("data.write")) === false) canWrite = false; } catch (e) {}
  }
  updateNotice();
  subscribeMeta();
  subscribe("tasks", "tasks"); subscribe("budget", "budget"); subscribe("guests", "guests"); subscribe("refs", "refs"); subscribe("votes", "votes");
  subscribe("vendors", "vendors"); subscribe("seserahan", "seserahan"); subscribe("rundown", "rundown"); subscribe("journal", "journal");
}

/* ---------- tampilan ---------- */
function renderCountdown() {
  const parts = [], l = daysTo(S.meta.lamaran), w = daysTo(S.meta.wedding);
  if (l !== null && l >= 0) parts.push("Lamaran " + l + " hari lagi");
  if (w !== null && w >= 0) parts.push("Nikah " + w + " hari lagi");
  $("countdown").textContent = parts.join(" · ") || "Isi tanggal di Ringkasan untuk mulai.";
}
function renderTabs() {
  $("tabs").innerHTML = TABS.map(([k, n]) => `<button role="tab" aria-selected="${k === tab}" data-tab="${k}">${n}</button>`).join("");
}
function view() {
  pendingRender = false;
  renderCountdown(); renderTabs();
  $("view").innerHTML = ({ ringkasan: vRingkasan, checklist: vChecklist, budget: vBudget, tamu: vTamu, referensi: vReferensi, vendor: vVendor, undangan: vUndangan, seserahan: vSeserahan, harih: vHariH, jurnal: vJurnal })[tab]();
  resolveNames();
}
const dis = () => canWrite && db ? "" : "disabled";
const loading = () => `<p class="empty">Memuat data…</p>`;

function vRingkasan() {
  const done = S.tasks.filter(t => t.done).length, total = S.tasks.length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const act = S.budget.reduce((a, b) => a + (+b.act || 0), 0);
  const paid = S.budget.reduce((a, b) => a + (+b.paid || 0), 0);
  const hadir = S.guests.filter(g => g.status === "hadir").reduce((a, g) => a + (+g.n || 0), 0);
  const next = S.tasks.filter(t => !t.done).map(t => ({ t, d: dueDate(t) })).filter(x => x.d).sort((a, b) => a.d - b.d).slice(0, 5);
  return `<div class="stack">
    ${hero()}
    <div class="card">
      <h2>Tanggal penting</h2>
      <div class="row">
        <label>Tanggal lamaran<input type="date" id="dl" value="${esc(S.meta.lamaran)}" ${dis()}></label>
        <label>Tanggal nikah<input type="date" id="dw" value="${esc(S.meta.wedding)}" ${dis()}></label>
      </div>
      <p class="sub">Tenggat checklist dihitung otomatis dari dua tanggal ini. Semua perubahan langsung terlihat oleh pasangan.</p>
    </div>
    <div class="card">
      <h2>Progres</h2>
      <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>
      <div class="count">
        <div><b>${done}/${total}</b><span>tugas selesai</span></div>
        <div><b>${S.guests.length}</b><span>undangan · ${hadir} orang konfirmasi hadir</span></div>
        <div><b style="font-size:20px">${rp(paid)}</b><span>sudah dibayar dari ${rp(act)}</span></div>
      </div>
    </div>
    <div class="card">
      <h2>Tugas terdekat</h2>
      ${next.length ? next.map(({ t, d }) => `<div class="task"><div class="body"><div class="t">${esc(t.t)}</div>
        <div class="meta ${d < today() ? "late" : ""}">${d < today() ? "Lewat tenggat · " : ""}${fmtDate(d)}</div></div></div>`).join("")
        : `<p class="empty">Isi tanggal lamaran atau nikah untuk melihat tugas terdekat.</p>`}
    </div>
    ${exportCard()}
  </div>`;
}

const likers = id => new Set(S.votes.filter(v => v.ref === id).map(v => v.by));
function hero() {
  const t = today(), w = daysTo(S.meta.wedding), l = daysTo(S.meta.lamaran);
  let big, cap;
  if (w === null) { big = "—"; cap = "Isi tanggal nikah di bawah untuk memulai hitung mundur."; }
  else if (w < 0) { big = "Sah!"; cap = "Selamat menempuh hidup baru."; }
  else if (w === 0) { big = "Hari ini"; cap = "Hari-H tiba. Selamat!"; }
  else { big = w; cap = "hari menuju hari-H · " + fmtDate(new Date(S.meta.wedding + "T00:00:00")) + " · sekitar " + Math.ceil(w / 7) + " minggu"; }
  const open = S.tasks.filter(x => !x.done).map(dueDate).filter(Boolean);
  const late = open.filter(d => d < t).length, soon = open.filter(d => d >= t && d - t <= 7 * 864e5).length;
  const chips = [];
  if (w !== null && w >= 0) chips.push(l !== null && l >= 0 ? "Menuju lamaran · " + l + " hari" : "Menuju hari-H");
  if (late) chips.push(late + " tugas terlambat");
  if (soon) chips.push(soon + " tugas minggu ini");
  const pay = payDues().filter(x => x.d && x.d - t <= 7 * 864e5).length;
  if (pay) chips.push(pay + " pembayaran ≤ 7 hari");
  let track = "";
  if (S.meta.wedding && w >= 0) {
    const W = new Date(S.meta.wedding + "T00:00:00"), L = S.meta.lamaran ? new Date(S.meta.lamaran + "T00:00:00") : null;
    const start = new Date(Math.min(t, L || t)), span = Math.max(1, W - start);
    const pos = d => Math.min(100, Math.max(0, (d - start) / span * 100));
    const stop = (label, p, extra) => `<div class="stop ${extra || ""} ${p < 9 ? "l" : p > 91 ? "r" : ""}" style="left:${p}%"><span>${label}</span></div>`;
    track = `<div class="track" aria-hidden="true"><div class="line"><i style="width:${pos(t)}%"></i></div>${L ? stop("Lamaran", pos(L)) : ""}${stop("Hari ini", pos(t), "up")}${stop("Nikah", 100)}</div>`;
  }
  return `<div class="hero"><div><div class="big">${big}</div><div class="cap">${cap}</div></div>${chips.length ? `<div class="chips">${chips.map(c => `<span>${c}</span>`).join("")}</div>` : ""}${track}</div>`;
}

const val = el => el.type === "checkbox" ? el.checked : el.type === "number" ? (+el.value || 0) : el.value;
const atDay = iso => new Date(iso + "T00:00:00");
function payDues() {
  const out = [];
  S.vendors.forEach(v => [["dp", "DP"], ["final", "Pelunasan"]].forEach(([k, l]) => {
    const amt = +v[k] || 0, ds = v[k + "Date"];
    if (amt > 0 && !v[k + "Paid"]) out.push({ v, l, amt, d: ds ? atDay(ds) : null });
  }));
  return out.sort((a, b) => (a.d ? +a.d : 9e15) - (b.d ? +b.d : 9e15));
}
function payRow(v, k, label) {
  return `<div class="pay"><input type="checkbox" data-v="${v.id}" data-f="${k}Paid" ${v[k + "Paid"] ? "checked" : ""} ${dis()} aria-label="${label} ${esc(v.name)} sudah dibayar">

    <input type="number" min="0" class="num" data-v="${v.id}" data-f="${k}" value="${v[k] || ""}" placeholder="Rp" ${dis()} aria-label="Jumlah ${label} ${esc(v.name)}">
    <input type="date" data-v="${v.id}" data-f="${k}Date" value="${esc(v[k + "Date"] || "")}" ${dis()} aria-label="Tanggal ${label} ${esc(v.name)}"></div>`;
}

  const open = items.filter(j => j.kind === "bahas" && !j.resolved).length;

    ${feed || `<div class="card"><p class="empty">Belum ada catatan.</p></div>`}

}
const csv = rows => "﻿" + rows.map(r => r.map(c => { c = String(c == null ? "" : c); return /[",\n;]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(",")).join("\r\n");
const EXPORTS = {

  seserahan: ["Seserahan", "seserahan-mahar.csv", () => [["Barang", "Jenis", "Harga", "Status"], ...[...S.seserahan].sort(byOrd).map(x => [x.name, x.kind, x.price || 0, SES_STATUS[x.status] || ""])]],
  rundown: ["Rundown", "rundown-acara.csv", () => [["Hari", "Jam", "Acara", "PIC", "Catatan"], ...[...S.rundown].sort((a, b) => (a.day || "Hari-H").localeCompare(b.day || "Hari-H") || (a.time || "").localeCompare(b.time || "")).map(r => [r.day || "Hari-H", r.time || "", r.title, r.pic || "", r.note || ""])]]
};
function exportCard() {

/* ---------- undangan online ---------- */
const b64u = s => btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
function inviteLink(name) {
  const i = S.meta.invite || {};
  const raw = { t: i.jenis, p: i.pria, w: i.wanita, op: i.ortuPria, ow: i.ortuWanita, d: i.tgl || S.meta.wedding, aj: i.akadJam, rj: i.resepsiJam, v: i.tempat, a: i.alamat, m: i.maps, dc: i.dress, ps: i.pesan, wa: i.wa, g: i.hadiah, n: name };
  const d = {}; Object.entries(raw).forEach(([k, v]) => { if (v) d[k] = v; });
  return INVITE_URL + "#" + b64u(JSON.stringify(d));
}
function waLink(g) {
  const i = S.meta.invite || {}, phone = String(g.phone || "").replace(/\D/g, "").replace(/^0/, "62");
  const text = "Halo " + g.name + ", kami mengundang Anda ke " + (i.jenis || "Pernikahan").toLowerCase() + " " + (i.pria || "") + " & " + (i.wanita || "") + ". Detail undangan bisa dibuka di sini:\n" + inviteLink(g.name);
  return "https://wa.me/" + phone + "?text=" + encodeURIComponent(text);
}
function markSent(id) {
  const g = S.guests.find(x => x.id === id);
  if (g && g.status === "belum") write(() => db.doc("guests/" + id).update({ status: "terkirim" }));
}
async function copyInvite(id) {
  const g = S.guests.find(x => x.id === id); if (!g) return;
  const link = inviteLink(g.name);
  try { await navigator.clipboard.writeText(link); flash("Link untuk " + g.name + " tersalin."); }
  catch (e) {
    flash(link); clearTimeout(flashT); flashT = setTimeout(updateNotice, 20000);
    const r = document.createRange(); r.selectNodeContents($("notice")); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  markSent(id);
}
function vUndangan() {
  if (state === "ready" && !(S.loaded.guests && S.loaded.meta)) return loading();
  const i = S.meta.invite || {};
  const inp = (label, key, type, ph) => `<label>${label}<input type="${type || "text"}" data-inv="${key}" value="${esc(i[key] || "")}" placeholder="${esc(ph || "")}" ${dis()}></label>`;
  const ta = (label, key, ph) => `<label style="flex-basis:100%">${label}<textarea data-inv="${key}" placeholder="${esc(ph || "")}" ${dis()}>${esc(i[key] || "")}</textarea></label>`;
  const gs = [...S.guests].sort(byOrd), online = gs.filter(g => g.mode === "online");
  const sent = online.filter(g => g.status !== "belum").length;
  const ready = !!((i.pria && i.wanita) && (i.tgl || S.meta.wedding));
  const rows = online.map(g => `<div class="task g"><div class="body"><div class="t">${esc(g.name)} <span class="pill ${(STAT[g.status] || ["", ""])[1]}">${(STAT[g.status] || [""])[0]}</span></div>
    <div class="meta">${g.phone ? esc(g.phone) : "Tanpa nomor WhatsApp: pilih kontak saat WhatsApp terbuka"}</div></div>
    <button class="btn ghost" data-copy="${g.id}" ${ready ? "" : "disabled"}>Salin link</button>
    <a class="btn" href="${ready ? esc(waLink(g)) : "#"}" target="_blank" rel="noopener noreferrer" data-sent="${g.id}" ${ready ? "" : "aria-disabled=\"true\" style=\"opacity:.5;pointer-events:none\""}>Kirim WhatsApp</a></div>`).join("");
  return `<div class="stack">
    <div class="card"><div class="count">
      <div><b>${online.length}</b><span>tamu online · ${sent} sudah dikirim</span></div>
      <div><b>${gs.length - online.length}</b><span>tamu undangan fisik</span></div></div>
      <p class="sub">Atur cara undang tiap tamu di tab Tamu. Tamu online mendapat link berisi namanya sendiri.</p></div>
    <div class="card"><h2>Detail undangan</h2>
      ${ready ? "" : `<div class="notice">Isi nama kedua mempelai dan tanggal acara agar link bisa dibuat.</div>`}
      <div class="row">
        <label>Jenis acara<select data-inv="jenis" ${dis()}>${["Pernikahan", "Lamaran", "Tunangan"].map(j => `<option ${((i.jenis || "Pernikahan") === j) ? "selected" : ""}>${j}</option>`).join("")}</select></label>
        ${inp("Tanggal acara", "tgl", "date")}
        ${inp("Nama mempelai pria", "pria", "text", "mis. Rafi")}${inp("Nama mempelai wanita", "wanita", "text", "mis. Alya")}
        ${inp("Orang tua pria", "ortuPria", "text", "Bapak ... & Ibu ...")}${inp("Orang tua wanita", "ortuWanita", "text", "Bapak ... & Ibu ...")}
        ${inp("Jam akad atau acara", "akadJam", "time")}${inp("Jam resepsi (opsional)", "resepsiJam", "time")}
        ${inp("Nama tempat", "tempat", "text", "mis. Gedung Melati")}${inp("Tautan Google Maps", "maps", "url", "https://maps.app.goo.gl/...")}
        ${ta("Alamat", "alamat", "alamat lengkap tempat acara")}
        ${inp("Busana tamu", "dress", "text", "mis. earth tone")}${inp("WhatsApp penerima konfirmasi", "wa", "tel", "0812...")}
        ${ta("Kata pembuka (opsional)", "pesan", "kosongkan untuk memakai kalimat standar")}
        ${ta("Tanda kasih (opsional)", "hadiah", "mis. BCA 1234567890 a.n. Nama")}
      </div>
      <p class="sub">Link tamu dibuat otomatis dari isian ini. Kalau ada yang diubah setelah link dikirim, kirim ulang link barunya.</p></div>
    <div class="card"><h2>Link untuk tamu online</h2>
      ${rows || `<p class="empty">Belum ada tamu online. Ubah cara undang menjadi Online di tab Tamu.</p>`}
      <div class="exports"><a class="btn ghost" href="${INVITE_URL}" target="_blank" rel="noopener noreferrer">Lihat contoh tampilan</a>${ready ? `<a class="btn ghost" href="${esc(inviteLink("Nama Tamu"))}" target="_blank" rel="noopener noreferrer">Lihat dengan data kalian</a>` : ""}</div></div>
    <div class="card"><h2>Supaya tamu bisa membuka</h2>
      <p class="sub">Halaman undangan terpisah dari aplikasi ini dan tidak berisi data pribadi kalian. Buka halaman undangan lalu atur Share agar siapa saja yang memegang link bisa melihat. Jangan bagikan link aplikasi perencana ini ke tamu.</p>
      <div class="linkbox">${INVITE_URL}</div></div>
  </div>`;
}

async function resolveNames() {
  const els = [...document.querySelectorAll("[data-by]")];
  const ids = [...new Set(els.map(e => e.dataset.by).filter(Boolean))];
  const need = ids.filter(i => !(i in names));
  if (need.length && userApi && userApi.profiles) {
    try { const ps = await userApi.profiles(need); need.forEach(i => { names[i] = (ps[i] && ps[i].name) || ""; }); } catch (e) {}
  }
  els.forEach(e => { const i = e.dataset.by; if (i) e.textContent = "oleh " + (i === me ? "kamu" : (names[i] || "pasangan")); });
}

async function shrink(file) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1200 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("gagal")), "image/jpeg", 0.82));
}

/* ---------- aksi ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-tab],[data-del],[data-rc],[data-rst],[data-like],[data-export],[data-copy],[data-sent],#addb,#tpl,#tplb");
  if (!el) return;
  if (el.dataset.sent) { markSent(el.dataset.sent); return; }
  if (el.dataset.copy) { copyInvite(el.dataset.copy); return; }
  if (el.dataset.export) {
    const ex = EXPORTS[el.dataset.export];
    try { await dlApi.save({ filename: ex[1], data: csv(ex[2]()) }); } catch (x) { if (!x || x.code !== "declined") flash("File tidak bisa disimpan di tampilan ini."); }
    return;
  }
  if (el.dataset.tab) { tab = el.dataset.tab; try { history.replaceState(null, "", "#" + tab); } catch (x) {} view(); }
  else if (el.dataset.like) {
    if (!me) return;
    const vid = el.dataset.like + "__" + me, has = S.votes.some(v => v.id === vid);
    write(() => has ? db.doc("votes/" + vid).delete() : db.doc("votes/" + vid).set({ ref: el.dataset.like, by: me }));
  }
  else if (el.dataset.rc) { refCat = el.dataset.rc; view(); }
  else if (el.dataset.rst) { refStatus = el.dataset.rst; view(); }
  else if (el.dataset.del) {
    if (!el.classList.contains("armed")) {
      el.classList.add("armed"); el.textContent = "Hapus?";
      setTimeout(() => { if (el.isConnected) { el.classList.remove("armed"); el.textContent = "×"; } }, 3000);
      return;
    }
    const [c, id] = el.dataset.del.split("/");
    const doc = S.refs.find(r => r.id === id && c === "refs");
    write(async () => { await db.doc(el.dataset.del).delete(); });
    if (c === "refs") S.votes.filter(v => v.ref === id).forEach(v => write(() => db.doc("votes/" + v.id).delete()));
    if (doc && doc.img && assetsApi) { try { await assetsApi.delete(doc.img); } catch (x) {} }
  }
  else if (el.id === "addb") write(() => col("budget").doc(uid()).set({ name: "Pos baru", est: 0, act: 0, paid: 0, ord: Date.now() }));
  else if (el.id === "tpl") {
    el.disabled = true; el.textContent = "Menyimpan…";
    await write(async () => { for (let i = 0; i < TEMPLATE.length; i++) { const t = TEMPLATE[i];
      await db.doc("tasks/t" + String(i).padStart(2, "0")).set({ t: t[0], cat: t[1], ref: t[2], m: t[3], done: false, ord: i }); } });
  }
  else if (el.id === "tplb") {
    el.disabled = true; el.textContent = "Menyimpan…";
    await write(async () => { for (let i = 0; i < BUDGET_TEMPLATE.length; i++)
      await db.doc("budget/b" + String(i).padStart(2, "0")).set({ name: BUDGET_TEMPLATE[i], est: 0, act: 0, paid: 0, ord: i }); });
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "dl") setMeta({ lamaran: el.value });
  else if (el.id === "dw") setMeta({ wedding: el.value });
  else if (el.id === "bt") setMeta({ target: +el.value || 0 });
  else if (el.dataset.done) write(() => db.doc("tasks/" + el.dataset.done).update({ done: el.checked }));
  else if (el.dataset.b) write(() => db.doc("budget/" + el.dataset.b).update({ [el.dataset.f]: el.dataset.f === "name" || el.dataset.f === "payer" ? el.value : (+el.value || 0) }));
  else if (el.dataset.ga) write(() => db.doc("guests/" + el.dataset.ga).update({ amplop: +el.value || 0 }));
  else if (el.dataset.gs) write(() => db.doc("guests/" + el.dataset.gs).update({ status: el.value }));
  else if (el.dataset.rs) write(() => db.doc("refs/" + el.dataset.rs).update({ status: el.value }));
  else if (el.dataset.v) write(() => db.doc("vendors/" + el.dataset.v).update({ [el.dataset.f]: val(el) }));
  else if (el.dataset.s) write(() => db.doc("seserahan/" + el.dataset.s).update({ [el.dataset.f]: val(el) }));
  else if (el.dataset.jr) write(() => db.doc("journal/" + el.dataset.jr).update({ resolved: el.checked }));
  else if (el.dataset.gm) write(() => db.doc("guests/" + el.dataset.gm).update({ mode: el.value }));
  else if (el.dataset.inv) setMeta({ invite: { ...(S.meta.invite || {}), [el.dataset.inv]: el.value.trim() } });
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === "addtask") {
    const f = { t: $("nt").value.trim(), cat: $("nc").value.trim() || "Acara", ref: $("nr").value, m: +$("nm").value || 0, done: false, ord: Date.now() };
    e.target.reset(); write(() => col("tasks").doc(uid()).set(f));
  } else if (id === "addguest") {
    const f = { name: $("gn").value.trim(), n: Math.max(1, +$("gc").value || 1), side: $("gside").value, mode: $("gmode").value, phone: $("gph").value.trim(), status: "belum", ord: Date.now() };
    e.target.reset(); write(() => col("guests").doc(uid()).set(f));
  } else if (id === "addvendor") {
    const f = { name: $("vn").value.trim(), cat: $("vc").value, total: +$("vt").value || 0, ord: Date.now() };
    e.target.reset(); write(() => col("vendors").doc(uid()).set(f));
  } else if (id === "addses") {
    const f = { name: $("sn").value.trim(), kind: $("sk").value, price: +$("sp").value || 0, status: "belum", ord: Date.now() };
    e.target.reset(); write(() => col("seserahan").doc(uid()).set(f));
  } else if (id === "addrun") {
    const f = { day: $("rd").value, time: $("rtm").value, title: $("rti").value.trim(), pic: $("rpic").value.trim(), note: $("rnt").value.trim(), ord: Date.now() };
    e.target.reset(); write(() => col("rundown").doc(uid()).set(f));
  } else if (id === "addjournal") {
    const f = { text: $("jt").value.trim(), kind: $("jk").value, by: me || "", resolved: false, ord: Date.now() };
    e.target.reset(); write(() => col("journal").doc(uid()).set(f));
  } else if (id === "addref") {
    const btn = $("rsub"); btn.disabled = true; btn.textContent = "Menyimpan…";
    const f = { title: $("rt").value.trim(), cat: $("rcat").value, status: $("rst").value, url: cleanUrl($("ru").value),
      price: +$("rp").value || 0, contact: $("rk").value.trim(), note: $("rn").value.trim(), by: me || "", ord: Date.now() };
    const file = $("ri") && $("ri").files[0];
    if (file && assetsApi) {
      try { const up = await assetsApi.upload(await shrink(file)); f.img = up.id; } catch (x) { flash("Foto tidak bisa diunggah. Referensi disimpan tanpa foto."); }
    }
    await write(() => col("refs").doc(uid()).set(f));
    refCat = "Semua"; refStatus = "semua"; view();
  }
});
init();
