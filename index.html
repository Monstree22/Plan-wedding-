<style>
/* Layout: satu kolom sempit seperti aplikasi HP; tab di atas, ringkasan dulu, detail kemudian. Data dipakai bersama lewat db. */
:root {
  --bg: #f3f5ef;
  --surface: #ffffff;
  --fg: #1c241d;
  --muted: #65705f;
  --line: #dde3d6;
  --accent: #4f6b52;
  --accent-fg: #ffffff;
  --accent-soft: #e3ebdd;
  --good: #2b7a6b;
  --warn: #b25e09;
  --bad: #b3261e;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121713; --surface: #1b221c; --fg: #e8eee6; --muted: #9aa896; --line: #2c352d;
    --accent: #a9c7a1; --accent-fg: #14210f; --accent-soft: #27332a;
    --good: #6fd6bd; --warn: #f0a24f; --bad: #ff8a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121713; --surface: #1b221c; --fg: #e8eee6; --muted: #9aa896; --line: #2c352d;
  --accent: #a9c7a1; --accent-fg: #14210f; --accent-soft: #27332a;
  --good: #6fd6bd; --warn: #f0a24f; --bad: #ff8a80; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-block: 20px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 640px; margin: 0 auto; display: grid; gap: 16px; }
h1, h2 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-size: 26px; letter-spacing: -0.01em; }
h2 { font-size: 18px; }
.sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.tabs button { flex: 1 0 auto; border: 0; background: none; color: var(--muted); font: 600 14px var(--font-body); padding: 9px 14px; border-radius: 9px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.stack { display: grid; gap: 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.row > * { min-width: 0; }
label { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; text-transform: uppercase; flex: 1 1 140px; }
input, select, textarea { font: 400 15px var(--font-body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 64px; }
input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.btn { border: 0; background: var(--accent); color: var(--accent-fg); font: 600 14px var(--font-body); padding: 10px 16px; border-radius: 8px; cursor: pointer; }
.btn.ghost { background: var(--accent-soft); color: var(--accent); }
.btn[disabled] { opacity: .5; cursor: default; }
.x { border: 0; background: none; color: var(--muted); font: 600 18px var(--font-body); cursor: pointer; padding: 4px 8px; border-radius: 6px; }
.x:hover { color: var(--bad); }
.count { display: flex; gap: 12px; flex-wrap: wrap; }
.count div { flex: 1 1 120px; background: var(--accent-soft); border-radius: 10px; padding: 12px; }
.count b { display: block; font: 700 28px var(--font-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.count span { font-size: 12px; color: var(--muted); }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.task { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.task:first-of-type { border-top: 0; }
.task .body { flex: 1; min-width: 0; }
.task.done .t { text-decoration: line-through; color: var(--muted); }
.meta { font-size: 12px; color: var(--muted); }
.meta.late { color: var(--bad); font-weight: 600; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.pill.good { color: var(--good); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 700px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 6px 4px; }
td { padding: 4px; border-top: 1px solid var(--line); }
td input { padding: 7px 8px; }
.num { text-align: right; }
.over { color: var(--bad); font-weight: 600; }
.empty { color: var(--muted); text-align: center; padding: 16px 0; display: grid; gap: 10px; justify-items: center; }
.notice { font-size: 13px; background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 8px 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { border: 1px solid var(--line); background: var(--surface); color: var(--muted); font: 600 13px var(--font-body); padding: 6px 12px; border-radius: 99px; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.refs { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.ref { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: grid; align-content: start; min-width: 0; }
.ref img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: var(--line); }
.ref .in { padding: 12px; display: grid; gap: 6px; min-width: 0; }
.ref .top { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
.ref h3 { margin: 0; font: 700 16px var(--font-display); overflow-wrap: anywhere; }
.ref a { color: var(--accent); font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
.ref p { margin: 0; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.ref select { width: auto; padding: 5px 8px; font-size: 13px; }
.price { font-variant-numeric: tabular-nums; font-weight: 600; }
details summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.hero { background: var(--accent); color: var(--accent-fg); border-radius: 18px; padding: 22px 20px 16px; display: grid; gap: 14px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -48px; top: -48px; width: 170px; height: 170px; border-radius: 50%; border: 26px solid color-mix(in srgb, var(--accent-fg) 14%, transparent); pointer-events: none; }
.hero .big { font: 700 80px/0.9 var(--font-display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.hero .cap { font-size: 14px; opacity: .92; }
.hero .chips { display: flex; gap: 6px; flex-wrap: wrap; }
.hero .chips span { background: color-mix(in srgb, var(--accent-fg) 18%, transparent); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; }
.track { position: relative; height: 60px; margin: 4px 8px 0; }
.track .line { position: absolute; left: 0; right: 0; top: 28px; height: 4px; border-radius: 9px; background: color-mix(in srgb, var(--accent-fg) 28%, transparent); }
.track .line i { display: block; height: 100%; background: var(--accent-fg); border-radius: 9px; }
.stop { position: absolute; top: 0; height: 60px; width: 0; }
.stop::before { content: ""; position: absolute; left: -8px; top: 22px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent-fg); border: 3px solid var(--accent); box-sizing: border-box; }
.stop span { position: absolute; top: 42px; left: 0; transform: translateX(-50%); font-size: 12px; font-weight: 600; white-space: nowrap; }
.stop.up span { top: 0; }
.stop.l span { transform: none; }
.stop.r span { transform: translateX(-100%); }
.like { border: 1px solid var(--line); background: var(--surface); color: var(--muted); font: 600 13px var(--font-body); padding: 5px 12px; border-radius: 99px; cursor: pointer; }
.like[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.like[disabled] { opacity: .5; cursor: default; }
.task.g { flex-wrap: wrap; }
.task.g .body { flex: 1 1 100%; }
.split { display: grid; gap: 8px; }
.split div { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.split .bar { height: 6px; }
.pay { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pay .plabel { font-weight: 600; font-size: 13px; min-width: 70px; }
.pay input[type="number"] { flex: 1 1 110px; width: auto; }
.pay input[type="date"] { flex: 1 1 140px; width: auto; }
.time { font: 700 16px var(--font-display); font-variant-numeric: tabular-nums; min-width: 52px; color: var(--accent); }
.entry p { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.entry.done p { text-decoration: line-through; color: var(--muted); }
.exports { display: flex; gap: 8px; flex-wrap: wrap; }
.snack { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin: 0 auto; background: var(--fg); color: var(--bg); padding: 12px 16px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; z-index: 40; box-shadow: 0 6px 20px rgba(0,0,0,.25); font-size: 14px; }
.snack .linkbtn { color: var(--bg); opacity: .95; font-weight: 700; }
.trow { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
.trow:first-of-type { border-top: 0; }
.th { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.th input { width: 210px; max-width: 100%; }
.amt-in { color: var(--good); font-weight: 600; font-variant-numeric: tabular-nums; }
.amt-out { color: var(--bad); font-weight: 600; font-variant-numeric: tabular-nums; }
a.btn { text-decoration: none; display: inline-block; }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .3s; } }

html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
#auth { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; padding: 16px; overflow: auto; }
#auth .box { width: 100%; max-width: 380px; display: grid; gap: 14px; }
#auth form { display: grid; gap: 12px; }
#auth .err { color: var(--bad); font-size: 13px; min-height: 18px; }
.who { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.linkbtn { border: 0; background: none; color: var(--muted); font: 600 13px var(--font-body); cursor: pointer; text-decoration: underline; padding: 4px; }

/* ===== Tampilan baru: navigasi bawah, ikon, cincin progres, formulir lipat ===== */
:root {
  --surface-2: #f7f9f4;
  --shadow: 0 1px 2px rgba(28,36,29,.05), 0 10px 24px -14px rgba(28,36,29,.18);
  --ease: cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --surface-2: #212922; --shadow: 0 1px 0 rgba(255,255,255,.03), 0 12px 28px -16px rgba(0,0,0,.6); } }
:root[data-theme="dark"] { --surface-2: #212922; --shadow: 0 1px 0 rgba(255,255,255,.03), 0 12px 28px -16px rgba(0,0,0,.6); }
body { padding-block: 18px calc(104px + env(safe-area-inset-bottom, 0px)); }
#view { display: grid; gap: 16px; align-content: start; }
.card { border-radius: 18px; box-shadow: var(--shadow); }
h2 { font-size: 17px; letter-spacing: -.005em; }
.top { display: flex; align-items: center; gap: 12px; padding: 2px 2px 4px; }
.mono { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font: 700 15px var(--font-display); letter-spacing: .02em; box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--accent-fg) 22%, transparent); flex: none; }
.top h1 { font-size: 21px; line-height: 1.1; }
.top .sub { margin-top: 3px; }
.ptitle h2 { font-size: 30px; letter-spacing: -.02em; line-height: 1.05; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; color: var(--muted); font: 600 14px var(--font-body); padding: 9px 12px; border-radius: 9px; cursor: pointer; transition: background .2s var(--ease), color .2s; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }

.nav { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: min(640px, 100%); display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; z-index: 30;
  background: color-mix(in srgb, var(--surface) 90%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); border-radius: 20px 20px 0 0; }
.nav button { border: 0; background: none; color: var(--muted); display: grid; justify-items: center; gap: 2px; padding: 4px 2px; font: 600 11px var(--font-body); cursor: pointer; min-height: 52px; transition: color .2s, transform .15s var(--ease); }
.nav button svg { width: 24px; height: 24px; padding: 4px 14px; box-sizing: content-box; border-radius: 99px; transition: background .25s var(--ease); }
.nav button[aria-current="page"] { color: var(--accent); }
.nav button[aria-current="page"] svg { background: var(--accent-soft); }
.nav button:active { transform: scale(.94); }
svg.ic { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.sheet { position: fixed; inset: 0; z-index: 50; visibility: hidden; }
.sheet.open { visibility: visible; }
.sheet .bg { position: absolute; inset: 0; background: rgba(10,16,11,.45); opacity: 0; transition: opacity .25s; }
.sheet.open .bg { opacity: 1; }
.sheet .panel { position: absolute; left: 50%; bottom: 0; width: min(640px, 100%); transform: translate(-50%, 100%); transition: transform .3s var(--ease); background: var(--surface); border-radius: 24px 24px 0 0; padding: 10px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; box-shadow: 0 -10px 40px rgba(0,0,0,.2); }
.sheet.open .panel { transform: translate(-50%, 0); }
.sheet .grip { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto; }
.sgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.sgrid button { border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); border-radius: 16px; padding: 14px 6px 12px; display: grid; justify-items: center; gap: 8px; font: 600 13px var(--font-body); cursor: pointer; transition: transform .15s var(--ease), background .2s; }
.sgrid button svg { width: 26px; height: 26px; color: var(--accent); }
.sgrid button[aria-current="page"] { background: var(--accent-soft); border-color: var(--accent); }
.sgrid button:active { transform: scale(.96); }
.sheet .linkbtn { justify-self: center; display: inline-flex; gap: 8px; align-items: center; }
.sheet .linkbtn svg { width: 18px; height: 18px; }

.count div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; }
.count b { font-size: 22px; color: var(--fg); }
.count span { line-height: 1.3; }
.rings { gap: 14px; }
.rrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.ring { display: grid; justify-items: center; gap: 6px; text-align: center; }
.dial { position: relative; width: 86px; height: 86px; }
.dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.dial circle { fill: none; stroke-width: 4.6; }
.dial .t { stroke: var(--line); }
.dial .v { stroke: var(--accent); stroke-linecap: round; transition: stroke-dasharray .8s var(--ease); }
.dial b { position: absolute; inset: 0; display: grid; place-items: center; font: 700 17px var(--font-display); font-variant-numeric: tabular-nums; }
.ring span { font-size: 12px; color: var(--muted); line-height: 1.25; }
.kas { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; }
.kas span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.kas b { font: 700 22px var(--font-display); font-variant-numeric: tabular-nums; }
.kas em { font-style: normal; font-size: 13px; font-weight: 600; width: 100%; }
.kas em.ok { color: var(--good); } .kas em.low { color: var(--bad); }

details.addwrap { background: var(--surface); border: 1px dashed color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius: 18px; }
details.addwrap > summary { list-style: none; cursor: pointer; padding: 14px 16px; font: 600 15px var(--font-body); color: var(--accent); display: flex; align-items: center; gap: 10px; }
details.addwrap > summary::-webkit-details-marker { display: none; }
details.addwrap > summary::before { content: "+"; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; font-size: 18px; line-height: 1; transition: transform .25s var(--ease); }
details.addwrap[open] > summary::before { transform: rotate(45deg); }
details.addwrap[open] { border-style: solid; box-shadow: var(--shadow); }
details.addwrap > form { padding: 2px 16px 16px; display: grid; gap: 12px; }
details#prof > summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
details#prof > summary::-webkit-details-marker { display: none; }
details#prof > summary::after { content: "Ubah"; margin-left: auto; font-size: 13px; font-weight: 600; color: var(--accent); }
details#prof[open] > summary::after { content: "Tutup"; }

.btn { border-radius: 12px; padding: 11px 18px; transition: transform .15s var(--ease), filter .2s; }
.btn:active { transform: scale(.97); }
@media (hover: hover) { .btn:hover { filter: brightness(1.06); } .ref { transition: transform .25s var(--ease), box-shadow .25s; } .ref:hover { transform: translateY(-2px); box-shadow: var(--shadow); } }
input, select, textarea { border-radius: 12px; padding: 10px 12px; }
.task { padding: 12px 0; }
.snack { bottom: calc(82px + env(safe-area-inset-bottom, 0px)); }
.hero { border-radius: 24px; box-shadow: var(--shadow); }
#view.enter > * { animation: rise .32s var(--ease) both; }
#view.enter > *:nth-child(2) { animation-delay: .04s; } #view.enter > *:nth-child(3) { animation-delay: .08s; } #view.enter > *:nth-child(4) { animation-delay: .12s; } #view.enter > *:nth-child(n+5) { animation-delay: .16s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #view.enter > * { animation: none; } .sheet .panel, .sheet .bg, .dial .v { transition: none; } }

.kick { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.cash { gap: 6px; }
.bigamt { font: 700 36px/1.05 var(--font-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.two > div { display: grid; gap: 2px; min-width: 0; }
.two b { font: 700 18px var(--font-display); font-variant-numeric: tabular-nums; }
.two em { font-style: normal; font-size: 12px; color: var(--muted); }
.chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }

.task.g select { flex: 1 1 120px; width: auto !important; min-width: 0; }
.task.g .x { flex: none; }
.task .body .t { font-weight: 500; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero { --accent: #2b4632; --accent-fg: #ecf2e8; } }
:root[data-theme="dark"] .hero { --accent: #2b4632; --accent-fg: #ecf2e8; }

<body>
